version: 1.1
comment: Unity Catalog semantics patterns - Currency conversion

source: orders

parameters:
  - name: p_target_currency
    display_name: Target Currency
    comment: Reporting currency to convert into (USD, EUR, GBP, JPY, ZAR, SAR)
    data_type: STRING
    default: "'EUR'"

joins:
  - name: fx
    source: exchange_rate
    'on': |-
      fx.rate_month = DATE_TRUNC('month', source.o_orderdate)
      AND fx.from_currency = 'USD'
      AND fx.to_currency = p_target_currency
      AND fx.rate_type = 'AVG'
    rely:
      at_most_one_match: true

fields:
  - name: OrderDate
    display_name: Order Date
    expr: o_orderdate
    format:
      type: date
      date_format: year_month_day
      leading_zeros: true

  - name: Month
    display_name: Order Month
    expr: DATE_TRUNC('month', o_orderdate)
    format:
      type: date
      date_format: year_month_day
      leading_zeros: true

  - name: TargetCurrency
    display_name: Target Currency
    expr: fx.to_currency

measures:
  - name: TotalPriceUSD
    display_name: Total Price (USD)
    comment: Total order price in the source currency (USD)
    expr: SUM(o_totalprice)
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
      hide_group_separator: false
      abbreviation: none

  - name: TotalPriceConverted
    display_name: Total Price (converted)
    comment: Converted from USD to p_target_currency at the AVG monthly rate
    expr: SUM(o_totalprice * fx.rate)
    format:
      type: number
      decimal_places:
        type: exact
        places: 2
      hide_group_separator: false
      abbreviation: none
