version: 1.1
comment: Unity Catalog semantics patterns

source: orders

joins:
  - name: customer
    source: customer
    'on': source.o_custkey = customer.c_custkey
    rely:
      at_most_one_match: true
    joins:
      - name: nation
        source: nation
        'on': customer.c_nationkey = nation.n_nationkey
        rely:
          at_most_one_match: true
        joins:
          - name: region
            source: region
            'on': nation.n_regionkey = region.r_regionkey
            rely:
              at_most_one_match: true

fields:
  - name: RegionName
    display_name: Region Name
    expr: customer.nation.region.r_name

  - name: CountryName
    display_name: Country Name
    expr: customer.nation.n_name

  - name: CustomerName
    display_name: Customer Name
    expr: customer.c_name

measures:
  - name: Revenue
    display_name: Revenue
    comment: Total order revenue (leaf-level additive measure)
    expr: SUM(o_totalprice)
    format:
      type: number
      decimal_places:
        type: exact
        places: 0
      hide_group_separator: false
      abbreviation: none

  # --- Parent subtotal: roll the leaf measure up to the parent (ancestor) level and
  #     repeat it on every child row, so a drill-down carries its parent's total. At the
  #     region -> country grain the parent is the region. ---
  - name: RevenueParentSubtotal
    display_name: Revenue - Parent Subtotal
    comment: Parent-level (region) rollup of Revenue, repeated on every child row
    expr: SUM(SUM(o_totalprice)) OVER (PARTITION BY `RegionName`)
    format:
      type: number
      decimal_places:
        type: exact
        places: 0
      hide_group_separator: false
      abbreviation: none

  # --- Percentage of parent node: a row's contribution to its parent, and to the grand
  #     total. Denominators are the windowed subtotals; NULLIF guards an empty partition. ---
  - name: PctOfParent
    display_name: "% of Parent"
    comment: This row's Revenue as a share of its parent (region) subtotal
    expr: SUM(o_totalprice) / NULLIF(SUM(SUM(o_totalprice)) OVER (PARTITION BY `RegionName`), 0)
    format:
      type: percentage
      decimal_places:
        type: exact
        places: 2

  - name: PctOfTotal
    display_name: "% of Total"
    comment: This row's Revenue as a share of the grand total (all rows)
    expr: SUM(o_totalprice) / NULLIF(SUM(SUM(o_totalprice)) OVER (), 0)
    format:
      type: percentage
      decimal_places:
        type: exact
        places: 2
