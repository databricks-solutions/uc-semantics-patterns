version: 1.1
comment: Unity Catalog semantics patterns

# Config-table variant of Static segmentation.
# Instead of hard-coding the price bands in a CASE expression, this metric view range-joins each order to the
# mocked configuration table (see Static_segmentation_config.sql), so the band boundaries live in data and can be
# edited without changing the definition. The segment dimensions read the band name straight from the joined
# table, wrapping it in a CASE that labels orders which fall outside every configured range as 'UNCLASSIFIED'.

source: orders
joins:
  - name: customer
    source: customer
    'on': source.o_custkey = customer.c_custkey
    rely:
      at_most_one_match: true
    joins:
      - name: nation
        source: nation
        'on': customer.c_nationkey = nation.n_nationkey
        rely:
          at_most_one_match: true
        joins:
          - name: region
            source: region
            'on': nation.n_regionkey = region.r_regionkey
            rely:
              at_most_one_match: true


  # Global price bands: range-join on order value only. Boundaries are min-inclusive / max-exclusive,
  # and the open-ended top band has max_price = NULL.
  - name: price_segment_range
    source: price_segment_range
    'on': >
      source.o_totalprice >= price_segment_range.min_price
      AND (source.o_totalprice < price_segment_range.max_price
           OR price_segment_range.max_price IS NULL)
    rely:
      at_most_one_match: true


fields:
  - name: RegionName
    display_name: Region Name
    expr: customer.nation.region.r_name

  - name: CountryName
    display_name: Country Name
    expr: customer.nation.n_name

  - name: CustomerName
    display_name: Customer Name
    expr: customer.c_name

  - name: MarketSegment
    display_name: Market Segment
    expr: customer.c_mktsegment

  - name: OrderDate
    display_name: Order Date
    expr: o_orderdate
    format:
      type: date
      date_format: year_month_day
      leading_zeros: true

  - name: Year
    display_name: Order Year
    expr: "DATE_TRUNC('year', o_orderdate)"
    format:
      type: date
      date_format: year_month_day
      leading_zeros: true

  - name: Month
    display_name: Order Month
    expr: "DATE_TRUNC('month', o_orderdate)"
    format:
      type: date
      date_format: year_month_day
      leading_zeros: true

  - name: Quarter
    display_name: Order Quarter
    expr: "DATE_TRUNC('quarter', o_orderdate)"
    format:
      type: date
      date_format: year_month_day
      leading_zeros: true

  - name: OrderPriority
    display_name: Order Priority
    expr: o_orderpriority

  - name: ShipPriority
    display_name: Ship Priority
    expr: o_shippriority

  # ===========================================
  # Segmentation dimensions (sourced from the joined config table)
  # ===========================================
  # Global price band - name and sort key come from price_segment_range.
  - name: PriceSegment
    display_name: Price Segment
    expr: >
      CASE
        WHEN price_segment_range.segment_name IS NULL THEN 'UNCLASSIFIED'
        ELSE price_segment_range.segment_name
      END

  - name: PriceSegmentSort
    display_name: Price Segment Sort
    expr: >
      CASE
        WHEN price_segment_range.segment_sort IS NULL THEN 99
        ELSE price_segment_range.segment_sort
      END

  - name: PriceMinRange
    display_name: Price Min Range
    expr: price_segment_range.min_price
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
      hide_group_separator: false
      abbreviation: none

  - name: PriceMaxRange
    display_name: Price Max Range
    expr: price_segment_range.max_price
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
      hide_group_separator: false
      abbreviation: none


measures:
  - name: TotalPrice
    display_name: Total Price
    comment: Sum of o_totalprice across all orders in the period
    expr: SUM(o_totalprice)
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
      hide_group_separator: false
      abbreviation: none

  - name: OrderCount
    display_name: Order Count
    comment: Count of orders in the period
    expr: COUNT(o_orderkey)
    format:
      type: number
      decimal_places:
        type: all
      hide_group_separator: false
      abbreviation: none