version: 1.1
comment: Unity Catalog semantics patterns

source: orders

joins:
  - name: customer
    source: customer
    'on': source.o_custkey = customer.c_custkey
    rely:
      at_most_one_match: true
    joins:
        - name: nation
          source: nation
          'on': customer.c_nationkey = nation.n_nationkey
          rely:
            at_most_one_match: true
          joins:
            - name: region
              source: region
              'on': nation.n_regionkey = region.r_regionkey
              rely:
                at_most_one_match: true

fields:
  - name: RegionName
    display_name: Region Name
    expr: customer.nation.region.r_name

  - name: CountryName
    display_name: Country Name
    expr: customer.nation.n_name

  - name: CustomerName
    display_name: Customer Name
    expr: customer.c_name

  - name: MarketSegment
    display_name: Market Segment
    expr: customer.c_mktsegment

  - name: OrderDate
    display_name: Order Date
    expr: o_orderdate
    format: 
      type: date
      date_format: year_month_day
      leading_zeros: true

  - name: Year
    display_name: Order Year
    expr: DATE_TRUNC('year', o_orderdate)
    format: 
      type: date
      date_format: year_month_day
      leading_zeros: true

  - name: Month
    display_name: Order Month
    expr: DATE_TRUNC('month', o_orderdate)
    format: 
      type: date
      date_format: year_month_day
      leading_zeros: true

  - name: Quarter
    display_name: Order Quarter
    expr: DATE_TRUNC('quarter', o_orderdate)
    format: 
      type: date
      date_format: year_month_day
      leading_zeros: true

  - name: Week
    display_name: Order Week
    expr: DATE_TRUNC('week', o_orderdate)
    format: 
      type: date
      date_format: year_month_day
      leading_zeros: true

  - name: OrderPriority
    display_name: Order Priority
    expr: o_orderpriority

  - name: ShipPriority
    display_name: Ship Priority
    expr: o_shippriority

measures:
  # ===========================================
  # Base measure
  # ===========================================

  - name: TotalPrice
    display_name: Total Price
    comment: Total order price (base measure without window)
    expr: SUM(o_totalprice)
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
      hide_group_separator: false
      abbreviation: none

  # ===========================================
  # Year-over-Year-to-Date (YOYTD)
  # ===========================================

  - name: TotalPrice_YTD
    display_name: Total Price YTD
    comment: 'Year-to-date total: cumulative sum from start of year to current date'
    expr: TotalPrice
    window:
      - order: OrderDate
        range: cumulative
        semiadditive: last
      - order: Year
        range: current
        semiadditive: last
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
      hide_group_separator: false
      abbreviation: none

  - name: TotalPrice_PYTD
    display_name: Total Price PYTD
    comment: 'Previous year-to-date: cumulative sum to same relative date in prior year'
    expr: TotalPrice
    window:
      - order: OrderDate
        range: cumulative
        semiadditive: last
        offset: -1 year
      - order: Year
        range: current
        semiadditive: last
        offset: -1 year
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
      hide_group_separator: false
      abbreviation: none

  - name: TotalPrice_YOYTD
    display_name: Total Price YOYTD
    comment: Year-over-year-to-date growth rate
    expr: (AGG(TotalPrice_YTD) - AGG(TotalPrice_PYTD)) / AGG(TotalPrice_PYTD)
    format:
      type: percentage
      decimal_places:
        type: exact
        places: 2

  # ===========================================
  # Quarter-over-Quarter-to-Date (QOQTD)
  # ===========================================

  - name: TotalPrice_QTD
    display_name: Total Price QTD
    comment: 'Quarter-to-date total: cumulative sum from start of quarter to current date'
    expr: TotalPrice
    window:
      - order: OrderDate
        range: cumulative
        semiadditive: last
      - order: Quarter
        range: current
        semiadditive: last
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
      hide_group_separator: false
      abbreviation: none

  - name: TotalPrice_PQTD
    display_name: Total Price PQTD
    comment: 'Previous quarter-to-date: cumulative sum to same relative date in prior quarter'
    expr: TotalPrice
    window:
      - order: OrderDate
        range: cumulative
        semiadditive: last
        offset: -3 months
      - order: Quarter
        range: current
        semiadditive: last
        offset: -3 months
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
      hide_group_separator: false
      abbreviation: none

  - name: TotalPrice_QOQTD
    display_name: Total Price QOQTD
    comment: Quarter-over-quarter-to-date growth rate
    expr: (AGG(TotalPrice_QTD) - AGG(TotalPrice_PQTD)) / AGG(TotalPrice_PQTD)
    format:
      type: percentage
      decimal_places:
        type: exact
        places: 2

  # ===========================================
  # Month-over-Month-to-Date (MOMTD)
  # ===========================================

  - name: TotalPrice_MTD
    display_name: Total Price MTD
    comment: 'Month-to-date total: cumulative sum from start of month to current date'
    expr: TotalPrice
    window:
      - order: OrderDate
        range: cumulative
        semiadditive: last
      - order: Month
        range: current
        semiadditive: last
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
      hide_group_separator: false
      abbreviation: none

  - name: TotalPrice_PMTD
    display_name: Total Price PMTD
    comment: 'Previous month-to-date: cumulative sum to same relative date in prior month'
    expr: TotalPrice
    window:
      - order: OrderDate
        range: cumulative
        semiadditive: last
        offset: -1 month
      - order: Month
        range: current
        semiadditive: last
        offset: -1 month
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
      hide_group_separator: false
      abbreviation: none

  - name: TotalPrice_MOMTD
    display_name: Total Price MOMTD
    comment: Month-over-month-to-date growth rate
    expr: (AGG(TotalPrice_MTD) - AGG(TotalPrice_PMTD)) / AGG(TotalPrice_PMTD)
    format:
      type: percentage
      decimal_places:
        type: exact
        places: 2

  # ===========================================
  # Week-over-Week-to-Date (WOWTD)
  # ===========================================

  - name: TotalPrice_WTD
    display_name: Total Price WTD
    comment: 'Week-to-date total: cumulative sum from start of week to current date'
    expr: TotalPrice
    window:
      - order: OrderDate
        range: cumulative
        semiadditive: last
      - order: Week
        range: current
        semiadditive: last
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
      hide_group_separator: false
      abbreviation: none

  - name: TotalPrice_PWTD
    display_name: Total Price PWTD
    comment: 'Previous week-to-date: cumulative sum to same relative date in prior week'
    expr: TotalPrice
    window:
      - order: OrderDate
        range: cumulative
        semiadditive: last
        offset: -7 days
      - order: Week
        range: current
        semiadditive: last
        offset: -7 days
    format:
      type: currency
      currency_code: USD
      decimal_places:
        type: exact
        places: 2
      hide_group_separator: false
      abbreviation: none

  - name: TotalPrice_WOWTD
    display_name: Total Price WOWTD
    comment: Week-over-week-to-date growth rate
    expr: (AGG(TotalPrice_WTD) - AGG(TotalPrice_PWTD)) / AGG(TotalPrice_PWTD)
    format:
      type: percentage
      decimal_places:
        type: exact
        places: 2
